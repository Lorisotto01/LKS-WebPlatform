<!doctype html>
<html lang="it" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="theme-color" content="#0A0A0F" />
    <meta
      name="description"
      content="Password manager offline per Windows con condivisione file sulla rete di casa: cifratura AES-256, niente cloud. L'alternativa locale a 1Password e Google Drive."
    />
    <title>Password manager offline e senza cloud | SecureLocalShare</title>
    <link rel="canonical" href="https://securelocalshare.sottolab.it/" />

    <!-- Open Graph (default: sovrascritti per pagina dall'hook useSeo) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SecureLocalShare" />
    <meta property="og:title" content="Password manager offline e senza cloud | SecureLocalShare" />
    <meta
      property="og:description"
      content="Password manager offline per Windows con condivisione file sulla rete di casa: cifratura AES-256, niente cloud. L'alternativa locale a 1Password e Google Drive."
    />
    <meta property="og:url" content="https://securelocalshare.sottolab.it/" />
    <meta property="og:image" content="https://securelocalshare.sottolab.it/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="it_IT" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Password manager offline e senza cloud | SecureLocalShare" />
    <meta
      name="twitter:description"
      content="Password manager offline per Windows con condivisione file sulla rete di casa: cifratura AES-256, niente cloud. L'alternativa locale a 1Password e Google Drive."
    />
    <meta name="twitter:image" content="https://securelocalshare.sottolab.it/og-image.png" />

    <!-- Dati strutturati: nome del sito nei risultati di Google (WebSite) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "SecureLocalShare",
        "alternateName": "LKS",
        "url": "https://securelocalshare.sottolab.it/",
        "inLanguage": "it-IT"
      }
    </script>

    <!-- Dati strutturati: prodotto software con i tre piani (rich snippet) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "SecureLocalShare",
        "alternateName": ["Secure Local Share", "SLS", ".lks"],
        "applicationCategory": "SecurityApplication",
        "applicationSubCategory": "Password Manager",
        "operatingSystem": "Windows 10, Windows 11",
        "description": "Password manager e condivisione file privati sulla tua rete locale. Cifratura AES-256-GCM, offline-first, nessun cloud: l'alternativa a 1Password + Google Drive che resta in casa tua.",
        "url": "https://securelocalshare.sottolab.it/",
        "inLanguage": "it-IT",
        "author": {
          "@type": "Person",
          "name": "Lorenzo Sottocorno"
        },
        "offers": [
          {
            "@type": "Offer",
            "name": "Free",
            "price": "0",
            "priceCurrency": "EUR",
            "category": "free"
          },
          {
            "@type": "Offer",
            "name": "Essential",
            "price": "4.99",
            "priceCurrency": "EUR",
            "category": "subscription"
          },
          {
            "@type": "Offer",
            "name": "Pro",
            "price": "9.99",
            "priceCurrency": "EUR",
            "category": "subscription"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
